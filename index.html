
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Interactive Dashboard</title>

    <link rel="stylesheet" href="css/style.css">

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <script defer src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script defer src="js/task-manager.js"></script>
    <script defer src="js/metric-converter.js"></script>
</head>

<body>
    <h1>My Interactive Dashboard</h1>
    <p>This dashboard was created by Jackson Antoine for the WEB-115 course at Wake Tech</p>

    <noscript>Unfortunately, your web browser does not support JavaScript.</noscript>

    <div class="container">
        <div class="row">

            <!-- Weekly Tasks -->
            <div class="col-md-6" id="weekly-tasks">
                <h2>Weekly Tasks</h2>

                <form id="goal-form">
                    <label for="user-name">Name:</label>
                    <input type="text" id="user-name">

                    <label for="daily-goal">Daily Task Goal:</label>
                    <input type="number" id="daily-goal">

                    <label for="bonus-tasks">Weekly Bonus Tasks:</label>
                    <input type="number" id="bonus-tasks">

                    <button type="submit" id="goal-btn">Calculate Goal</button>
                </form>

                <p id="goal-message"></p>

                <!-- Task Manager -->
                <div id="task-list">
                    <h3>Weekly Task List</h3>
                    <p>Enter a task below to manage your goals.</p>

                    <form id="task-form">
                        <label for="task-name">Enter task:</label>
                        <input type="text" id="task-name" required>

                        <label for="task-priority">Priority:</label>
                        <select id="task-priority">
                            <option value="High">High</option>
                            <option value="Medium" selected>Medium</option>
                            <option value="Low">Low</option>
                        </select>

                        <label for="task-important">
                            <input type="checkbox" id="task-important">
                            Important
                        </label>

                        <button type="submit" id="add-task">Add Task</button>
                    </form>

                    <ul id="user-tasks"></ul>
                    <button type="button" id="delete-list">Delete List</button>
                </div>
            </div>

            <!-- Metric Converter -->
            <div class="col-md-6" id="metric-converter">
                <h2>Imperial/Metric Converter</h2>

                <form id="converter-form">
                    <label for="conversion-value">Enter a value:</label>
                    <input type="number" id="conversion-value" step="any" required>

                    <label for="conversion-type">Select conversion:</label>
                    <select id="conversion-type">
                        <option value="1">Inches to Centimeters</option>
                        <option value="2">Feet to Centimeters</option>
                        <option value="3">Yards to Meters</option>
                        <option value="4">Miles to Kilometers</option>
                        <option value="5">Centimeters to Inches</option>
                        <option value="6">Centimeters to Feet</option>
                        <option value="7">Meters to Yards</option>
                        <option value="8">Kilometers to Miles</option>
                    </select>

                    <button type="submit" id="convert-button">Convert</button>
                </form>

                <p id="conversion-result">Result will appear here.</p>
            </div>

        </div>
    </div>
</body>
</html>
